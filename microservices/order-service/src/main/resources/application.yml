spring.application.name: order-service

server.port: 8001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pgdb
    username: admin
    password: 123456
  jpa:
    hibernate:
        ddl-auto: create-drop
    properties:
        hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile:
      - docker
  datasource:
      url: jdbc:postgresql://postgresql:5432/pgdb
  jpa:
    hibernate:
        ddl-auto: create-only

server.port: 8080