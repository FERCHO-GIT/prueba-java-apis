spring.application.name: driver-service

server.port: 5001

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/driver_db
        username: admin
        password: 123456
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true

---
