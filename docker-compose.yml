services:
  order-compose-service:
      build: microservices/order-compose-service
      ports:
        - "8000:8080"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
      deploy:
        resources:
          limits:
            cpus: '0.75' 
          reservations:
            cpus: '0.25'

  driver-service:
      build: microservices/driver-service
      ports:
        - "5001:8080"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
      depends_on:
          mysql-service:
            condition: service_healthy

  order-service:
      build: microservices/order-service
      ports:
        - "8001:8080"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
      depends_on:
        postgresql:
          condition: service_healthy
      deploy:
        resources:
          limits:
            cpus: '0.75' 
          reservations:
            cpus: '0.25'

  mysql-service:
    image: mysql:8.4.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: driver_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
    ports: 
     - "3306:3306"
    healthcheck:
      test: mysql --user=admin --password=123456 --execute="SHOW DATABASES;"
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  postgresql:
      image: postgres:18
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: 123456
        POSTGRES_DB: pgdb
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
        interval: 5s
        timeout: 2s
        retries: 5
      deploy:
        resources:
          limits:
            cpus: '0.75' 
          reservations:
            cpus: '0.25'

volumes:
  mysql_data:
  pgdata:
    driver: local