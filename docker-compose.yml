services:
  
  mysql:
    image: mysql:8.4.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drivers
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
    ports: 
     - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgresql:
      image: postgres:18
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: 123456
        POSTGRES_DB: pgdb
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
        interval: 5s
        timeout: 2s
        retries: 5
      deploy:
        resources:
          limits:
            cpus: '0.75' 
          reservations:
            cpus: '0.25'

volumes:
  mysql_data:
  pgdata:
    driver: local